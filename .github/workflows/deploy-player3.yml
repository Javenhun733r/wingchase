name: Deploy to Player3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web export
        run: npm run build

      - name: Deploy to Player 3
        env:
          PLAYER3_API_TOKEN: ${{ secrets.PLAYER3_API_TOKEN }}
          PLAYER3_GAME_ID: ${{ secrets.PLAYER3_GAME_ID }}
        run: |
          mkdir -p .p3-tools
          curl -sSL https://player3.gg/sdk/build/pix3l-validate.mjs -o .p3-tools/pix3l-validate.mjs
          curl -sSL https://player3.gg/sdk/build/player3-deploy.mjs -o .p3-tools/player3-deploy.mjs
          node .p3-tools/player3-deploy.mjs --build ./dist --game-type demo
